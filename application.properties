spring.application.name=hellospringboot
server.port=8080

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/online_supermarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Create the tables automatically on a new computer (and add new columns later).
# Without this line MySQL stays empty and the app fails with "Table ... doesn't exist".
spring.jpa.hibernate.ddl-auto=update

# ---- Sessions (Module 1) ----
# Log out automatically after 30 minutes without activity
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Module 1: accounts ----
# First staff account, created on start-up if none exists. CHANGE THESE.
app.admin.email=admin@supermarket.test
app.admin.password=Admin12345
# Lock an account for 15 minutes after 5 wrong passwords in a row
account.max-failed-logins=5
account.lock-minutes=15

# ---- Store details (receipts) ----
app.store.name=Bula Maleka Supermarket
app.store.address=Victoria Parade, Suva, Fiji
app.store.phone=330 0000

# ---- Module 3: product photos ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- Catalogue seed (seed/products.psv) ----
# true  = on every start, make the shop match seed/products.psv (overwrites edits made on the admin page)
# false = only load the seed file the first time (normal use)
catalog.sync-from-file=true

# ---- Module 4: cart ----
# Minimum value (FJD) for an online order to pass checkout validation
cart.minimum-order=20.00

# ---- Module 5: payments (all FJD) ----
payment.delivery-fee=7.50
payment.free-delivery-threshold=100.00
# Card processing fee (0.015 = 1.5%). Mobile wallets have no fee.
payment.card-surcharge-rate=0.015
payment.wallet-limit=1000.00
payment.store-account=SUPERMARKET-SETTLEMENT

# ---- Module 9: delivery ----
delivery.max-orders-per-slot=12
delivery.max-stops-per-driver-slot=4
delivery.average-speed-kmh=30
delivery.minutes-per-stop=10
delivery.road-factor=1.3
# Store location (route start), Suva
delivery.store-latitude=-18.1416
delivery.store-longitude=178.4419
delivery.booking-days-ahead=14
delivery.minimum-lead-hours=2
delivery.cancel-cutoff-hours=2